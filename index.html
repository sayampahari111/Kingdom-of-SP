<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom of SP</title>

  <style>
    body {
      background: #08142b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: #1a2740;
      width: 100%;
      max-width: 650px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      color: #1ee26b;
      font-size: 3rem;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    select,
    input[type="file"] {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
    }

    button {
      background: #1ee26b;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #16c65b;
    }

    h2 {
      margin-top: 35px;
      font-size: 2rem;
    }

    pre {
      background: black;
      padding: 20px;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 120px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Kingdom of SP</h1>

    <p>Upload your Image or PDF</p>

    <label for="action">Choose Action:</label>
    <select id="action">
      <option value="extract">Extract Text</option>
      <option value="translate">Translate to Bangla</option>
    </select>

    <br />

    <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.pdf" />

    <br />

    <button id="runBtn">Run</button>

    <h2>Result:</h2>
    <pre id="result">Nothing yet...</pre>
  </div>

  <script>
    document.getElementById("runBtn").addEventListener("click", async () => {
      const fileInput = document.getElementById("fileInput");
      const action = document.getElementById("action").value;
      const resultBox = document.getElementById("result");

      if (!fileInput.files.length) {
        resultBox.textContent = "Please choose a file.";
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("action", action);

      resultBox.textContent = "Processing...";

try {
        // Render compatible API call
        const response = await fetch("/upload", {
          method: "POST",
          body: formData
        });

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch (e) {
          resultBox.textContent = "Server Error:\n\n" + text;
          return;
        }
        if (action === "translate" && data.translated_text) {
          resultBox.textContent =
            "=== Extracted Text ===\n\n" +
            data.extracted_text +
            "\n\n=== Bangla Translation ===\n\n" +
            data.translated_text;
        } else {
          resultBox.textContent = JSON.stringify(data, null, 2);
        }

      } catch (error) {
        resultBox.textContent = "Error: " + error;
      }
    });
  </script>
</body>
</html>
